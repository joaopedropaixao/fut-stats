# Blueprint do Render: API de staging (plano free), deploy automático a cada push na develop.
# Passo a passo em docs/deploy.md.
services:
  - type: web
    name: fut-stats-api-staging
    runtime: node
    plan: free
    # Mais perto do Brasil entre as regiões do Render; o banco do Neon deve ficar em us-east-1 também.
    region: virginia
    branch: develop
    autoDeployTrigger: commit
    # Versão do Node vem do .nvmrc; o pnpm, do campo "packageManager" (via corepack).
    # O /usr/bin do Render é só leitura: o corepack cria o atalho do pnpm em .render-bin e ela vai na frente do PATH.
    # O turbo builda só a api e o que ela usa (shared, domain).
    # No fim, aplica as migrations no Neon (o plano free não tem pre-deploy command). Usa a DIRECT_URL.
    buildCommand: mkdir -p .render-bin && corepack enable --install-directory .render-bin && export PATH="$PWD/.render-bin:$PATH" && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@fut-stats/api && pnpm --filter @fut-stats/api db:deploy
    # Sobe direto com o node (o PATH do build não vale aqui).
    startCommand: cd apps/api && node dist/main.js
    healthCheckPath: /api/health
    # Só redeploya quando muda algo que afeta a API (mudança só no front não acorda o Render).
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - .nvmrc
        - render.yaml
    envVars:
      # Connection string do Neon (branch dev). O Render pede o valor ao criar o Blueprint.
      - key: DATABASE_URL
        sync: false
      # Conexão direta do Neon (sem "-pooler"), só para as migrations do build.
      - key: DIRECT_URL
        sync: false
      # Segredo que assina o JWT da sessão. O Render gera um valor aleatório na criação; trocar desloga todo mundo.
      - key: JWT_SECRET
        generateValue: true
      # Client OAuth do Google (projeto fut-stats no Google Cloud). Valores colados à mão no painel do Render.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Endereço do app no navegador (a Vercel, que repassa /api/* para cá). A callback do Google sai daqui
      # e tem que bater com a cadastrada no Google Cloud.
      - key: APP_URL
        value: https://fut-stats-three.vercel.app
